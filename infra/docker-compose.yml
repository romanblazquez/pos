# Retail OS — infrastructure stack.
#
# Designed to run on a Raspberry Pi 4/5 (arm64) or any x86_64 host.
# All images are multi-arch — no extra flags needed for Pi.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml logs -f postgres
#   docker compose -f infra/docker-compose.yml down       # stop (data preserved)
#   docker compose -f infra/docker-compose.yml down -v   # DESTRUCTIVE: removes volumes
#
# On Raspberry Pi: ensure Docker ≥24, then copy .env.example → .env and set a real PG password.

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail_os}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - retail_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail_os}']
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: '256mb'

  # Scheduled pg_dump backups → ./infra/backups/ on the host.
  # Keeps 7 daily + 4 weekly + 6 monthly gzipped dumps.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: retail-os-pgbackup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail_os}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

  redis:
    image: redis:7-alpine
    container_name: retail-os-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - retail_redis:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Typesense — fast full-text search for marketplace product/listing search.
  # typesense/typesense publishes multi-arch images (amd64 + arm64),
  # so this works on both Raspberry Pi 4/5 and x86_64 without any flags.
  typesense:
    image: typesense/typesense:27.1
    container_name: retail-os-typesense
    restart: unless-stopped
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - retail_typesense:/data
    command: '--data-dir /data --api-key ${TYPESENSE_API_KEY:-dev-typesense-key} --enable-cors'
    healthcheck:
      # The typesense/typesense image has neither curl nor wget, and /bin/sh
      # is dash (no /dev/tcp support) — must invoke bash explicitly for its
      # dependency-free /dev/tcp health check.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"']
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenTelemetry collector. Uncomment when wiring observability.
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   ports: ['4317:4317', '4318:4318']

  # BGG login + bulk catalog scraping. Runs its own Playwright/Chromium with a
  # stealth plugin (BGG sits behind a Cloudflare JS challenge that detects plain
  # automation regardless of source IP — Steel's self-hosted image was tried
  # first but its bundled browser fails to launch at all due to an upstream
  # fingerprint-generator bug, and even patched around it provides no real
  # stealth, so it was dropped in favor of running Chromium directly here).
  bgg-scraper:
    build:
      context: ..
      dockerfile: apps/bgg-scraper/Dockerfile
    container_name: retail-os-bgg-scraper
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      BGG_IMAGE_DIR: /data/bgg-images
      BGG_IMAGE_PUBLIC_BASE_URL: ${BGG_IMAGE_PUBLIC_BASE_URL:-http://localhost:3001/images}
      BGG_DOWNLOAD_IMAGES: ${BGG_DOWNLOAD_IMAGES:-true}
    ports:
      - '${BGG_SCRAPER_PORT:-3001}:3001'
    volumes:
      - ../data/bgg-images:/data/bgg-images
    shm_size: '512mb'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Continuous cron-style enrichment worker. It claims 50 durable DB records,
  # processes them serially, waits a random 20-40 seconds, and repeats. When the
  # catalog is caught up it remains alive and polls for newly imported products.
  # A BGG/Google rejection opens a persistent circuit and stops outbound work.
  bgg-enricher:
    build:
      context: ..
      dockerfile: apps/bgg-enricher/Dockerfile
    container_name: retail-os-bgg-enricher
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      bgg-scraper:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail}@postgres:5432/${POSTGRES_DB:-retail_os}?schema=public
      BGG_SCRAPER_URL: http://bgg-scraper:3001
      BGG_ENRICHER_STATE_DIR: /var/lib/bgg-enricher
      BGG_ENRICHER_HEALTH_PORT: 3002
      BGG_ENRICH_BATCH_SIZE: ${BGG_ENRICH_BATCH_SIZE:-50}
      BGG_BATCH_DELAY_MIN_SECONDS: ${BGG_BATCH_DELAY_MIN_SECONDS:-20}
      BGG_BATCH_DELAY_MAX_SECONDS: ${BGG_BATCH_DELAY_MAX_SECONDS:-40}
      BGG_ITEM_DELAY_MS: ${BGG_ITEM_DELAY_MS:-1500}
      BGG_EMPTY_POLL_SECONDS: ${BGG_EMPTY_POLL_SECONDS:-300}
      BGG_MAX_CONSECUTIVE_FAILURES: ${BGG_MAX_CONSECUTIVE_FAILURES:-5}
      BGG_MAX_PRODUCT_ATTEMPTS: ${BGG_MAX_PRODUCT_ATTEMPTS:-3}
      BGG_RETRY_DELAY_SECONDS: ${BGG_RETRY_DELAY_SECONDS:-21600}
      GOOGLE_TRANSLATE_ENABLED: ${GOOGLE_TRANSLATE_ENABLED:-true}
      GOOGLE_TRANSLATE_TARGET_ISO: ${GOOGLE_TRANSLATE_TARGET_ISO:-es}
      GOOGLE_TRANSLATE_TARGET_LOCALE: ${GOOGLE_TRANSLATE_TARGET_LOCALE:-es-MX}
      GOOGLE_TRANSLATE_MIN_DELAY_MS: ${GOOGLE_TRANSLATE_MIN_DELAY_MS:-3000}
      GOOGLE_TRANSLATE_JITTER_MS: ${GOOGLE_TRANSLATE_JITTER_MS:-1000}
      TRANSLATION_MODERATION_STATUS: ${TRANSLATION_MODERATION_STATUS:-NEEDS_REVIEW}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key}
    ports:
      - '${BGG_ENRICHER_HOST_PORT:-3003}:3002'
    volumes:
      - ../data/bgg-enricher:/var/lib/bgg-enricher
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  retail_pg:
  retail_redis:
  retail_typesense:

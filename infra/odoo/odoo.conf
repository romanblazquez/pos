[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Master password for the database manager UI at /web/database/manager
admin_passwd = retail-master
logfile = /dev/stdout
log_level = info
; Allow the Electron shell to make JSON-RPC calls from localhost
; (no origin restriction needed for desktop-first usage)
proxy_mode = False

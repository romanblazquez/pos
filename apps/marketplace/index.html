    <script>
      try {
        const match = document.cookie.match(/(?:^|;\s*)jp-theme=(light|dark)(?:;|$)/);
        const stored = localStorage.getItem('jp-theme') || localStorage.getItem('mkt_theme');
        const theme = match?.[1] || stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#CE6A41' : '#B4502E';
      } catch (_) {}
    </script>
